<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reporte de campaña de influencers · LCI Bogotá</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
<style>
/* Layout: un reporte por influencer. Banda con selector → identidad + publicación (red, formato, fecha) → franja de 6 indicadores → conclusiones a todo el ancho → gráfico a todo el ancho → conversación a todo el ancho. */
:root{
  --bg:#EDF0F4; --paper:#FFFFFF; --ink:#172131; --muted:#5D6878; --line:#D6DCE4; --soft:#F4F6F9;
  --navy:#14284B; --navy-2:#1D3866; --on-navy:#FFFFFF; --on-navy-muted:#AEBBD0;
  --accent:#1F6FD1; --accent-soft:#E2ECFA;
  --pos:#1F6FD1; --neu:#B7C3D3; --neg:#D9822B;
  --good:#1E7B45; --warn:#B4570B;
  --font:"Archivo", Arial, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --paper:#161E2C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2A3446; --soft:#1B2435;
  --navy:#0A1630; --navy-2:#16284A; --on-navy:#FFFFFF; --on-navy-muted:#8FA0BD;
  --accent:#6AA8F0; --accent-soft:#1C2E4A;
  --pos:#6AA8F0; --neu:#4A5872; --neg:#F0A04B;
  --good:#5CC48A; --warn:#F0A04B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --paper:#161E2C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2A3446; --soft:#1B2435;
  --navy:#0A1630; --navy-2:#16284A; --on-navy:#FFFFFF; --on-navy-muted:#8FA0BD;
  --accent:#6AA8F0; --accent-soft:#1C2E4A;
  --pos:#6AA8F0; --neu:#4A5872; --neg:#F0A04B;
  --good:#5CC48A; --warn:#F0A04B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1180px;margin:0 auto}
h1,h2{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Banda con selector */
.band{background:var(--navy);color:var(--on-navy);padding-block:18px 0}
.band .in{display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font:700 15px var(--font);font-stretch:85%}
.brand span{font-size:12.5px;color:var(--on-navy-muted)}
.pdf{font:600 13px var(--font);color:var(--navy);background:var(--on-navy);border:0;border-radius:3px;padding:8px 14px;cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:10px;font:600 14px var(--font);color:var(--on-navy-muted);background:transparent;border:0;border-radius:6px 6px 0 0;padding:10px 16px 12px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--on-navy);background:var(--navy-2)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--navy-2);color:var(--on-navy);flex:none}
.tab .av{width:28px;height:28px;font-size:11px}
.tab[aria-selected="true"] .av{background:var(--accent);color:#fff}

main{padding-block:22px 40px}
main .in{display:grid;gap:16px}

/* Identidad + publicación */
.who{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px}
.id{display:flex;align-items:center;gap:16px;min-width:0}
.id .av{width:72px;height:72px;font-size:22px;background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent)}
.id .av.all{box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--line);background:#fff}
.tab .av{box-shadow:0 0 0 2px var(--navy-2)}
.tab[aria-selected="true"] .av{box-shadow:0 0 0 2px var(--accent)}
.who h2{font-size:clamp(28px,4.4vw,44px);font-weight:800;font-stretch:80%;line-height:.95}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

/* Encabezado del reporte */
.top{background:var(--paper);border-bottom:1px solid var(--line);padding-block:20px}
.toprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 28px}
.title{display:flex;align-items:center;gap:18px;min-width:0}
.brandlogo{width:68px;height:68px;border-radius:50%;flex:none;background:#fff}
.kicker{font:600 14px var(--font);color:var(--accent)}
.rt{font-size:clamp(26px,3.6vw,38px);font-weight:800;font-stretch:78%;line-height:1;letter-spacing:-.005em;margin:0}
.period{font-size:14px;color:var(--muted)}
.by{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .pdf{background:var(--navy);color:var(--on-navy);text-decoration:none;display:inline-block}
a.pub{text-decoration:none;color:inherit}
.band{padding-block:10px 0}
.who .sub{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted);margin-top:6px;align-items:center}
.who .sub b{color:var(--ink);font-weight:600}
.niche{font:600 12.5px var(--font);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 11px;white-space:nowrap}
.pub{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px 10px 10px}
.net{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none}
.net.ig{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF)}
.net.fb{background:#1877F2}
.net svg{width:22px;height:22px}
.pub b{display:block;font-size:14px}
.pub span{font-size:12.5px;color:var(--muted)}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{padding:14px 16px;display:grid;gap:4px;align-content:start;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font:700 26px/1.05 var(--font);font-stretch:85%}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.money{background:var(--soft)}
.v.warn{color:var(--warn)} .v.good{color:var(--good)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 22px;display:grid;gap:12px;align-content:start;min-width:0}
.panel h2{font-size:16px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}

.concl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 32px}
.concl li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px;align-items:baseline;font-size:14.5px;line-height:1.5}
.concl li::before{content:"";width:8px;height:8px;background:var(--accent)}

.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart .org{fill:var(--line)} .chart .paid{fill:var(--accent)}
.chart .vl{font:12px var(--font);fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.chart .pv{fill:var(--accent);font-weight:700}
.chart .xl{font:11.5px var(--font);fill:var(--muted)}
.chart .med{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4;opacity:.55}
.chart .ml{font:600 11.5px var(--font);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.chart .axis{stroke:var(--line)}
.chart .mk{fill:var(--navy)} .chart .mkt{font:700 10.5px var(--font);fill:var(--on-navy)}
.why{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 24px}
.why li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13px;color:var(--muted)}
.why b{display:block;color:var(--ink);font-size:13.5px}
.why .m{width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--on-navy);font:700 10.5px/20px var(--font);text-align:center}

/* Conversación */
.talk{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px}
.score{display:grid;gap:10px;align-content:start}
.score .big{font:800 40px/1 var(--font);font-stretch:80%;color:var(--pos)}
.score .big small{font:600 14px var(--font);color:var(--muted);margin-left:6px}
.balbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}
.balbar i{display:block;height:100%}
.balbar .p{background:var(--pos)} .balbar .u{background:var(--neu)} .balbar .x{background:var(--neg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot.p{background:var(--pos)} .dot.u{background:var(--neu)} .dot.x{background:var(--neg)}
.quotes{list-style:none;margin:0;padding:0;display:grid}
.quotes li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.quotes li:first-child{border-top:0;padding-top:0}
.quotes .rk{font-weight:700;color:var(--accent)}
.quotes li span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.quotes li span b{color:var(--ink);font-size:14px}

/* Pestaña "Todas las publicaciones" */
.tab .av.all{background:var(--navy-2)}
.tab[aria-selected="true"] .av.all{background:var(--navy);color:var(--on-navy)}
.id .av.all{background:var(--navy);color:var(--on-navy)}
.av svg{width:55%;height:55%}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 12.5px var(--font);color:var(--muted);padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right;white-space:nowrap}
td.rk{font-weight:700;color:var(--accent);width:32px}
.cell{display:flex;align-items:center;gap:10px;min-width:0}
.cell .av{width:32px;height:32px;font-size:12px;background:var(--accent);color:#fff}
.cell .net{width:26px;height:26px;border-radius:7px}
.cell .net svg{width:15px;height:15px}
.cell b{display:block}
.cell small{display:block;font-size:12.5px;color:var(--muted)}
.go{font:600 13px var(--font);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.go:hover{text-decoration:underline}
.netrow{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr)) minmax(0,1.8fr);gap:12px 20px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.netrow:first-of-type{border-top:0;padding-top:0}
.netrow .net{width:44px;height:44px;border-radius:10px}
.netrow .net svg{width:24px;height:24px}
.netrow div{display:grid}
.netrow .l{font-size:12.5px;color:var(--muted)}
.netrow .v{font:700 20px/1.1 var(--font);font-stretch:85%}
.split{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.split b{color:var(--ink);font-size:15px}
@media (max-width:760px){.netrow{grid-template-columns:auto repeat(2,minmax(0,1fr))}}

footer{font-size:12px;color:var(--muted);padding-top:6px}

@media (max-width:980px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(3n){border-right:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:760px){
  .concl,.talk{grid-template-columns:1fr}
  .why{grid-template-columns:1fr}
}
@media (max-width:520px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-right:1px solid var(--line)!important;border-top:0!important}
  .kpi:nth-child(2n){border-right:0!important}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)!important}
  .kpi .v{font-size:22px}
  .panel{padding:16px}
  .id .av{width:52px;height:52px;font-size:18px}
}
@page{size:A4 landscape;margin:8mm}
@media print{
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:12px}
  .top .pdf,.band{display:none}
  .band{padding-block:12px}
  main{padding-block:12px 0}
  .panel{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top gut">
  <div class="in toprow">
    <div class="title">
      <img class="brandlogo" src="../assets/logo-lci.jpg" alt="LCI Bogotá">
      <h1 class="rt">Reporte de campaña de influencers</h1>
    </div>
    <div class="by">
      <a class="pdf" id="pdf" href="pdf/todas.pdf" download>Descargar PDF</a>
    </div>
  </div>
</header>
<nav class="band gut" aria-label="Pestañas del reporte">
  <div class="in">
    <div class="tabs" role="tablist" aria-label="Vista" id="tabs"></div>
  </div>
</nav>

<main class="gut">
  <div class="in" id="view" role="tabpanel"></div>
</main>

<script>
(function(){
  // DATA la genera scripts/build_reporte.py con pipeline/metrics.py: aquí solo se formatea.
  var DATA = /*__DATA__*/null;
  var ASSETS = '../assets/';
  var V = DATA.values, C = DATA.creators, POSTS = DATA.posts, T = DATA.totals, NETS = DATA.networks;
  var ICON = {
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg>',
    fb:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H7.9v3h2.6V21z"/></svg>'
  };
  var FORMATS = [['Reel','reels'],['Historia','historias'],['Carrusel','carruseles'],['Post','posts']];

  var nf = new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
  var n1 = new Intl.NumberFormat('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1});
  var n2 = new Intl.NumberFormat('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
  function int(x){return nf.format(Math.round(x));}
  function cop(x){return '$' + nf.format(Math.round(x));}
  function copM(x){return x >= 1e6 ? '$' + n1.format(x/1e6) + ' M' : cop(x);}
  function pct(x){return n1.format(x*100) + ' %';}
  function roiTxt(r){return (r>0?'+':'') + nf.format(r*100) + ' %';}
  function k(x){return x >= 100000 ? nf.format(Math.round(x/1000)) + 'K' : n1.format(x/1000) + 'K';}
  function initials(n){return n.split(' ').filter(function(w){return w.length>2}).slice(0,2).map(function(w){return w[0]}).join('');}
  function face(c){return c.avatar ? '<img src="'+ASSETS+'avatars/'+c.avatar+'" alt="">' : initials(c.name);}
  function byId(id){return C.filter(function(c){return c.id===id;})[0];}
  var LOGO = '<img src="'+ASSETS+'logo-lci.jpg" alt="">';
  function net(p, extra){return '<span class="net '+p.net+'" role="img" aria-label="'+p.netName+'"'+(extra||'')+'>'+ICON[p.net]+'</span>';}

  function chart(c){
    var W=1080,H=280,base=228,top=40,max=Math.max.apply(null,c.reels.map(function(r){return r[0];})),n=c.reels.length,slot=(W-90)/n,bw=Math.min(46,slot*.55);
    var y=function(v){return base-(v/max)*(base-top);};
    var ym=y(c.med);
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Reproducciones de sus últimos '+n+' reels. El de LCI tuvo '+k(c.posts[0].views)+'; su mediana es '+k(c.med)+'.">';
    s+='<line class="med" x1="8" x2="'+(W-84)+'" y1="'+ym.toFixed(1)+'" y2="'+ym.toFixed(1)+'"/>';
    s+='<text class="ml" x="'+(W-78)+'" y="'+(ym+4).toFixed(1)+'">Mediana '+k(c.med)+'</text>';
    c.reels.forEach(function(r,i){
      var v=r[0], cx=8+slot*i+slot/2, yy=y(v), paid=i===c.lci;
      s+='<rect class="'+(paid?'paid':'org')+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(base-yy).toFixed(1)+'" rx="2"/>';
      s+='<text class="vl'+(paid?' pv':'')+'" x="'+cx.toFixed(1)+'" y="'+(yy-7).toFixed(1)+'" text-anchor="middle">'+k(v)+'</text>';
      if(r[1]) s+='<text class="xl'+(paid?' pv':'')+'" x="'+cx.toFixed(1)+'" y="'+(base+18)+'" text-anchor="middle">'+r[1]+'</text>';
      if(paid) s+='<text class="xl pv" x="'+cx.toFixed(1)+'" y="'+(base+34)+'" text-anchor="middle">LCI</text>';
      if(c.marks[i]) s+='<circle class="mk" cx="'+cx.toFixed(1)+'" cy="'+(yy-28).toFixed(1)+'" r="10"/><text class="mkt" x="'+cx.toFixed(1)+'" y="'+(yy-24.3).toFixed(1)+'" text-anchor="middle">'+c.marks[i]+'</text>';
    });
    s+='<line class="axis" x1="8" x2="'+(W-84)+'" y1="'+base+'" y2="'+base+'"/></svg>';
    return s;
  }

  function roiTile(emv, pay, roi, txt, note){
    if (roi !== null) return '<div class="kpi money"><span class="l">ROI</span><span class="v num '+(roi>=0?'good':'warn')+'">'+roiTxt(roi)+'</span><span class="d">Inversión: '+copM(pay)+(note?' ('+note+')':'')+'</span></div>';
    return '<div class="kpi money"><span class="l">ROI</span><span class="v num">—</span><span class="d">'+txt+'</span></div>';
  }

  function render(c){
    var tk = c.talk, w = function(x){return (x/tk.read*100).toFixed(1)+'%';};
    document.getElementById('view').innerHTML =
      '<section class="who" aria-label="Influencer">'+
        '<div class="id"><span class="av" aria-hidden="true">'+face(c)+'</span><div><h2>'+c.name+'</h2>'+
          '<div class="sub"><span>@'+c.handle+'</span><span><b>'+int(c.followers)+'</b> seguidores</span><span class="niche">'+c.niche+'</span></div></div></div>'+
        c.posts.map(function(p){return '<a class="pub" href="'+p.url+'" target="_blank" rel="noopener">'+net(p)+
          '<span><b>'+p.format+' en '+p.netName+'</b><span>'+p.date+' · '+p.type+'</span></span></a>';}).join('')+
      '</section>'+

      '<section class="kpis" aria-label="Indicadores">'+
        '<div class="kpi"><span class="l">Reproducciones</span><span class="v num">'+int(c.t.views)+'</span><span class="d">'+pct(c.reach)+' de sus seguidores</span></div>'+
        '<div class="kpi"><span class="l">Engagement</span><span class="v num">'+pct(c.er)+'</span><span class="d">'+int(c.t.likes)+' me gusta y '+int(c.t.comments)+' comentarios</span></div>'+
        '<div class="kpi"><span class="l">Frente a su contenido habitual</span><span class="v num '+(c.idx<1?'warn':'good')+'">'+n2.format(c.idx)+'×</span><span class="d">Mediana de sus reels: '+k(c.med)+'</span></div>'+
        '<div class="kpi"><span class="l">Comentarios positivos</span><span class="v num">'+nf.format(tk.pos/tk.read*100)+' %</span><span class="d">'+tk.pos+' de '+tk.read+' leídos</span></div>'+
        '<div class="kpi money"><span class="l">EMV</span><span class="v num">'+copM(c.t.emv)+'</span><span class="d">Valor mediático en COP</span></div>'+
        roiTile(c.t.emv, c.t.pay, c.roi, 'Pendiente del valor pagado', c.roiNote)+
      '</section>'+

      '<section class="panel" aria-labelledby="h-c"><h2 id="h-c">Conclusiones</h2><ul class="concl">'+
        '<li><span>El reel sumó <b>'+int(c.t.views)+' reproducciones</b>, el '+pct(c.reach)+' de sus seguidores, con un engagement de '+pct(c.er)+'.</span></li>'+
        '<li><span>Rindió <b>'+n2.format(c.idx)+'× frente a su contenido habitual</b>'+(c.isMin?': fue el de menos reproducciones entre sus últimos '+c.reels.length+' reels':'')+'. '+c.cause+'</span></li>'+
        '<li><span>La conversación fue <b>favorable</b>: '+c.talkLine+'</span></li>'+
        '<li><span>Generó un <b>EMV de '+cop(c.t.emv)+'</b> (me gusta × '+cop(V.like)+' + comentarios × '+cop(V.comment)+'). '+
          (c.roi!==null ? 'Con un pago de '+cop(c.t.pay)+', el ROI fue de '+roiTxt(c.roi)+(c.roiNote?' ('+c.roiNote+' para tener su ROI completo; estamos a la espera de esa información)':'')+'.' : 'El ROI se calcula cuando LCI confirme el valor pagado.')+'</span></li>'+
      '</ul></section>'+

      '<section class="panel" aria-labelledby="h-g"><h2 id="h-g">Reel de LCI frente a sus últimos '+c.reels.length+' reels</h2>'+
        '<p class="hint">Reproducciones de cada reel por fecha de publicación, del más antiguo al más reciente. La línea punteada es la mediana de sus otros reels.</p>'+
        '<div class="chart">'+chart(c)+'</div>'+
        '<ul class="why">'+c.why.map(function(x){return '<li><span class="m">'+x[0]+'</span><div><b>'+x[1]+'</b>'+x[2]+'</div></li>';}).join('')+'</ul>'+
      '</section>'+

      '<section class="panel" aria-labelledby="h-t"><h2 id="h-t">Conversación</h2><div class="talk">'+
        '<div class="score"><span class="big num">'+nf.format(tk.pos/tk.read*100)+' %<small>positivos</small></span>'+
          '<div class="balbar" role="img" aria-label="'+tk.pos+' positivos, '+tk.neu+' neutros, '+tk.neg+' críticos"><i class="p" style="width:'+w(tk.pos)+'"></i>'+(tk.neu?'<i class="u" style="width:'+w(tk.neu)+'"></i>':'')+(tk.neg?'<i class="x" style="width:'+w(tk.neg)+'"></i>':'')+'</div>'+
          '<div class="legend"><span><i class="dot p"></i><b>'+tk.pos+'</b> positivos</span><span><i class="dot u"></i><b>'+tk.neu+'</b> neutros</span><span><i class="dot x"></i><b>'+tk.neg+'</b> '+(tk.neg===1?'crítico':'críticos')+'</span></div>'+
          '<p class="hint">'+tk.note+'</p></div>'+
        '<div><p class="hint" style="margin-bottom:8px">Comentarios con más me gusta</p><ul class="quotes">'+c.top.map(function(q,i){return '<li><span class="rk">'+(i+1)+'</span>“'+q[0]+'”<span><b>'+q[1]+'</b> me gusta</span></li>';}).join('')+'</ul></div>'+
      '</div></section>'+
      '<footer>© 2026 Datalítica Colombia S.A.S.</footer>';
  }

  // Vista "Todas las publicaciones": responde lo mismo que el PPT de Runway (total, por red, cuentas y contenidos por EMV)
  function splitHtml(formats){
    return '<div class="split">'+FORMATS.map(function(f){var n=formats[f[0]]||0; return '<span><b>'+n+'</b> '+(n===1?f[0].toLowerCase():f[1])+'</span>';}).join('')+'</div>';
  }

  // Nota del ROI total cuando a algún influencer le faltan acciones por medir
  var PENDING = (function(){var p=C.filter(function(c){return c.roiNote;}); return p.length ? 'parcial: '+p.map(function(c){return 'a '+c.name+' '+c.roiNote;}).join('; ') : null;})();

  function renderAll(){
    document.getElementById('view').innerHTML =
      '<section class="who" aria-label="Campaña">'+
        '<div class="id"><span class="av all" aria-hidden="true">'+LOGO+'</span><div><h2>Todas las publicaciones</h2>'+
          '<div class="sub"><span><b>'+C.length+'</b> influencers</span><span><b>'+POSTS.length+'</b> publicaciones pagas</span><span><b>'+int(T.fol)+'</b> seguidores combinados</span></div></div></div>'+
        '<div class="pub">'+NETS.map(function(n){return net(n);}).join('')+
          '<span><b>Redes activas</b><span>'+NETS.map(function(n){return n.name;}).join(', ')+'</span></span></div>'+
      '</section>'+

      '<section class="kpis" aria-label="Indicadores de la campaña">'+
        '<div class="kpi money"><span class="l">EMV total</span><span class="v num">'+copM(T.emv)+'</span><span class="d">Valor mediático en COP</span></div>'+
        '<div class="kpi"><span class="l">Reproducciones</span><span class="v num">'+int(T.views)+'</span><span class="d">'+pct(T.views/T.fol)+' de los seguidores</span></div>'+
        '<div class="kpi"><span class="l">Interacciones</span><span class="v num">'+int(T.inter)+'</span><span class="d">'+int(T.likes)+' me gusta y '+int(T.comments)+' comentarios</span></div>'+
        '<div class="kpi"><span class="l">Engagement</span><span class="v num">'+pct(T.inter/T.views)+'</span><span class="d">Interacciones ÷ reproducciones</span></div>'+
        '<div class="kpi"><span class="l">Influencers</span><span class="v num">'+C.length+'</span><span class="d">'+POSTS.length+' publicaciones pagas</span></div>'+
        roiTile(T.emv, T.pay, T.roi, 'Pendiente del valor pagado', PENDING)+
      '</section>'+

      '<section class="panel" aria-labelledby="h-n"><h2 id="h-n">Resultados por red</h2>'+
        NETS.map(function(n){
          return '<div class="netrow">'+net(n)+
            '<div><span class="l">'+n.name+'</span><span class="v">'+n.creators+' influencers</span></div>'+
            '<div><span class="l">EMV</span><span class="v num">'+copM(n.emv)+'</span></div>'+
            '<div><span class="l">Reproducciones</span><span class="v num">'+int(n.views)+'</span></div>'+
            '<div><span class="l">Engagement</span><span class="v num">'+pct(n.er)+'</span></div>'+
            '<div><span class="l">Formatos</span>'+splitHtml(n.formats)+'</div></div>';
        }).join('')+
      '</section>'+

      '<section class="panel" aria-labelledby="h-i"><h2 id="h-i">Influencers por EMV</h2><div class="tw"><table>'+
        '<thead><tr><th>#</th><th>Influencer</th><th>Nicho</th><th class="r">Seguidores</th><th class="r">Publicaciones</th><th class="r">Engagement</th><th class="r">Frente a su contenido</th><th class="r">EMV</th><th class="r">ROI</th></tr></thead><tbody>'+
        C.map(function(c,i){return '<tr><td class="rk">'+(i+1)+'</td>'+
          '<td><div class="cell"><span class="av">'+face(c)+'</span><span><button type="button" class="go" data-go="'+c.id+'">'+c.name+'</button><small>@'+c.handle+'</small></span></div></td>'+
          '<td><span class="niche">'+c.niche+'</span></td><td class="r num">'+int(c.followers)+'</td><td class="r num">'+c.posts.length+'</td><td class="r num">'+pct(c.er)+'</td>'+
          '<td class="r num">'+n2.format(c.idx)+'×</td><td class="r num"><b>'+copM(c.t.emv)+'</b></td>'+
          '<td class="r num">'+(c.roi!==null?roiTxt(c.roi)+(c.roiNote?'<small style="color:var(--muted);display:block">('+c.roiNote+')</small>':''):'<small style="color:var(--muted)">—</small>')+'</td></tr>';}).join('')+
      '</tbody></table></div></section>'+

      '<section class="panel" aria-labelledby="h-pp"><h2 id="h-pp">Publicaciones por EMV</h2><div class="tw"><table>'+
        '<thead><tr><th>#</th><th>Publicación</th><th>Influencer</th><th>Tipo</th><th class="r">Reproducciones</th><th class="r">Me gusta</th><th class="r">Comentarios</th><th class="r">Engagement</th><th class="r">EMV</th></tr></thead><tbody>'+
        POSTS.map(function(p,i){var c=byId(p.creator); return '<tr><td class="rk">'+(i+1)+'</td>'+
          '<td><div class="cell">'+net(p)+'<span><b>'+p.format+' · <a href="'+p.url+'" target="_blank" rel="noopener">ver</a></b><small>'+p.date+'</small></span></div></td>'+
          '<td><button type="button" class="go" data-go="'+c.id+'">'+c.name+'</button></td><td><small style="color:var(--muted)">'+p.type+'</small></td>'+
          '<td class="r num">'+int(p.views)+'</td><td class="r num">'+int(p.likes)+'</td><td class="r num">'+int(p.comments)+'</td><td class="r num">'+pct(p.er)+'</td><td class="r num"><b>'+copM(p.emv)+'</b></td></tr>';}).join('')+
      '</tbody></table></div><p class="hint">EMV = me gusta × '+cop(V.like)+' + comentarios × '+cop(V.comment)+', valores de referencia de LCI.</p></section>'+
      '<footer>© 2026 Datalítica Colombia S.A.S.</footer>';
  }

  var TABS = ['todas'].concat(C.map(function(c){return c.id;}));
  window.REPORT_TABS = TABS;   // lo usa scripts/render_pdf.py
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = '<button type="button" class="tab" role="tab" id="tab-todas" aria-controls="view"><span class="av all">'+LOGO+'</span>Todas las publicaciones</button>' +
    C.map(function(c){return '<button type="button" class="tab" role="tab" id="tab-'+c.id+'" aria-controls="view"><span class="av">'+face(c)+'</span>'+c.name+'</button>';}).join('');
  function select(id, focus){
    var c = byId(id), tid = c ? c.id : 'todas';
    Array.prototype.forEach.call(tabs.children, function(b){var on=b.id==='tab-'+tid; b.setAttribute('aria-selected',on); b.tabIndex=on?0:-1; if(on&&focus) b.focus();});
    document.getElementById('view').setAttribute('aria-labelledby','tab-'+tid);
    if (c) render(c); else renderAll();
    document.getElementById('pdf').setAttribute('href','pdf/'+tid+'.pdf');
    try{ history.replaceState(null,'','#'+tid); }catch(e){}
  }
  tabs.addEventListener('click', function(e){var b=e.target.closest('.tab'); if(b) select(b.id.slice(4));});
  document.getElementById('view').addEventListener('click', function(e){var b=e.target.closest('[data-go]'); if(b){ select(b.getAttribute('data-go')); window.scrollTo(0,0); }});
  tabs.addEventListener('keydown', function(e){
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
    var i = TABS.indexOf(tabs.querySelector('[aria-selected="true"]').id.slice(4));
    i = (i + (e.key==='ArrowRight'?1:-1) + TABS.length) % TABS.length; select(TABS[i], true);
  });
  window.addEventListener('hashchange', function(){ select((location.hash||'').slice(1)); });
  select((location.hash||'').slice(1));
})();
</script>
</body>
</html>
